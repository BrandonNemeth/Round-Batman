apiVersion: v1
kind: Service
metadata:
  name: round-batman-db
  namespace: round-batman
spec:
  clusterIP: None
  selector:
    app: round-batman-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: round-batman-db
  namespace: round-batman
spec:
  serviceName: round-batman-db
  replicas: 1
  selector:
    matchLabels:
      app: round-batman-db
  template:
    metadata:
      labels:
        app: round-batman-db
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: roundbatman
            - name: POSTGRES_USER
              value: roundbatman
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: round-batman-db-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "roundbatman", "-d", "roundbatman"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "roundbatman", "-d", "roundbatman"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
