kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Round-Batman API: host :8080 -> kind node NodePort :30080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Grafana: host :3000 -> kind node NodePort :30030
      - containerPort: 30030
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Prometheus: host :9090 -> kind node NodePort :30090
      - containerPort: 30090
        hostPort: 9090
        listenAddress: "127.0.0.1"
        protocol: TCP
