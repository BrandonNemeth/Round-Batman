apiVersion: v1
kind: Service
metadata:
  name: round-batman-api
  namespace: round-batman
  labels:
    app: round-batman-api
spec:
  type: NodePort
  selector:
    app: round-batman-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: round-batman-api
  namespace: round-batman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: round-batman-api
  template:
    metadata:
      labels:
        app: round-batman-api
    spec:
      containers:
        - name: api
          image: localhost/round-batman:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: round-batman-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: round-batman-db-credentials
                  key: password
            # $(POSTGRES_PASSWORD) is expanded from the value defined above.
            - name: ConnectionStrings__RoundBatman
              value: "Host=round-batman-db;Port=5432;Database=roundbatman;Username=roundbatman;Password=$(POSTGRES_PASSWORD)"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
